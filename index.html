<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Архив «Звезда»</title>

    <style>
        body {
            margin: 0;
            background: #070a0f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            margin: 120px auto;
            max-width: 600px;
            padding: 40px;
            background: #0d131b;
            border: 1px solid #293542;
            border-radius: 12px;
        }

        h1 {
            letter-spacing: 4px;
        }

        button {
            margin-top: 25px;
            padding: 14px 25px;
            background: #202d3a;
            color: white;
            border: 1px solid #526579;
            border-radius: 7px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>АРХИВ «ЗВЕЗДА»</h1>

    <p>ДЕЛО №001</p>

    <h2>«ПОСЛЕДНЯЯ ПЛЁНКА»</h2>

    <button onclick="startGame()">
        ОТКРЫТЬ ДЕЛО
    </button>

</div>

<script>

function startGame() {
    alert("ДОСТУП ПОЛУЧЕН\n\nРасследование начинается.");
}

</script>

</body>
</html>
