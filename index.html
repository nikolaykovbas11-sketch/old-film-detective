<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Архив «Звезда»</title>

<style>
    body {
        margin: 0;
        background: #101010;
        color: #eeeeee;
        font-family: Arial, sans-serif;
    }

    .screen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .box {
        width: 90%;
        max-width: 600px;
        padding: 35px;
        border: 1px solid #555;
        background: #181818;
        box-sizing: border-box;
    }

    h1 {
        margin-top: 0;
        font-size: 28px;
    }

    .case {
        color: #aaa;
        margin: 15px 0 30px;
    }

    button {
        background: #eeeeee;
        color: #111;
        border: none;
        padding: 14px 25px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #cccccc;
    }

    #investigation {
        display: none;
        min-height: 100vh;
        padding: 30px;
        box-sizing: border-box;
    }

    .header {
        border-bottom: 1px solid #444;
        padding-bottom: 20px;
        margin-bottom: 30px;
    }

    .header h1 {
        margin-bottom: 8px;
    }

    .status {
        color: #999;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
    }

    .card {
        background: #181818;
        border: 1px solid #444;
        padding: 20px;
    }

    .card h2 {
        font-size: 18px;
        margin-top: 0;
    }

    .number {
        font-size: 30px;
        margin: 10px 0;
    }
</style>
</head>

<body>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="start" class="screen">

    <div class="box">

        <h1>АРХИВ «ЗВЕЗДА»</h1>

        <div class="case">
            ДЕЛО №001

            «ПОСЛЕДНЯЯ ПЛЁНКА»
        </div>

        <button onclick="openCase()">
            ОТКРЫТЬ ДЕЛО
        </button>

    </div>

</div>

<!-- ЭКРАН РАССЛЕДОВАНИЯ -->
<div id="investigation">

    <div class="header">

        <h1>ДЕЛО №001</h1>

        <div class="status">
            Последняя плёнка
        </div>

    </div>

    <div class="cards">

        <div class="card">
            <h2>МАТЕРИАЛЫ</h2>
            <div class="number">0</div>
            Найдено
        </div>

        <div class="card">
            <h2>ЗАБЛОКИРОВАНО</h2>
            <div class="number">8</div>
            Файлов
        </div>

        <div class="card">
            <h2>СТАТУС</h2>
            <div class="number">?</div>
            Дело не раскрыто
        </div>

    </div>

</div>

<script>

function openCase() {

    document.getElementById("start").style.display = "none";

    document.getElementById("investigation").style.display = "block";

}

</script>

</body>
</html>
