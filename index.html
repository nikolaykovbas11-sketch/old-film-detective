<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тайна старой киностудии</title>

    <style>
        body {
            margin: 0;
            background: #0b0f14;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            margin: 100px auto;
            max-width: 700px;
            padding: 40px;
            background: #121923;
            border: 1px solid #344252;
            border-radius: 12px;
        }

        h1 {
            font-size: 32px;
        }

        p {
            color: #9da9b5;
            font-size: 18px;
        }

        button {
            margin-top: 20px;
            padding: 14px 25px;
            background: #1d2936;
            color: white;
            border: 1px solid #526579;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2a3949;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>КИНОСТУДИЯ «ЗВЕЗДА»</h1>

    <p>ДЕЛО №001</p>

    <p>«ПОСЛЕДНЯЯ ПЛЁНКА»</p>

    <button onclick="startGame()">
        ОТКРЫТЬ ДЕЛО
    </button>

</div>

<script>
function startGame() {
    alert("Расследование начинается...");
}
</script>

</body>
</html>
