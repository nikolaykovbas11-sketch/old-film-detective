<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Архив киностудии «Звезда»</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #080b10;
        color: #d8dee9;
        font-family: Arial, sans-serif;
    }

    .app {
        min-height: 100vh;
    }

    header {
        background: #0d1219;
        border-bottom: 1px solid #26313d;
        padding: 18px 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 20px;
        font-weight: bold;
        letter-spacing: 2px;
    }

    .status {
        color: #7ee787;
        font-size: 13px;
    }

    main {
        max-width: 1100px;
        margin: auto;
        padding: 30px 20px;
    }

    .case-header {
        border: 1px solid #26313d;
        background: #0d1219;
        padding: 25px;
        border-radius: 10px;
        margin-bottom: 20px;
    }

    .case-number {
        color: #778899;
        font-size: 13px;
        letter-spacing: 2px;
    }

    h1 {
        margin: 8px 0;
        font-size: 30px;
    }

    .description {
        color: #8f9baa;
        line-height: 1.6;
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 20px;
    }

    .stat {
        background: #080b10;
        border: 1px solid #202a35;
        padding: 15px;
        border-radius: 7px;
    }

    .stat-title {
        color: #6d7987;
        font-size: 12px;
    }

    .stat-value {
        font-size: 20px;
        margin-top: 5px;
    }

    nav {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    nav button,
    .action-button {
        background: #111821;
        border: 1px solid #2a3643;
        color: #cbd5e1;
        padding: 11px 16px;
        border-radius: 6px;
        cursor: pointer;
    }

    nav button:hover,
    .action-button:hover {
        background: #19232e;
    }

    nav button.active {
        border-color: #6b7f95;
        color: white;
    }

    .section {
        display: none;
    }

    .section.active {
        display: block;
    }

    .panel {
        background: #0d1219;
        border: 1px solid #26313d;
        border-radius: 10px;
        padding: 22px;
        margin-bottom: 15px;
    }

    .panel h2 {
        margin-top: 0;
        font-size: 19px;
    }

    .evidence {
        border-left: 3px solid #56697c;
        background: #10161e;
        padding: 15px;
        margin: 12px 0;
        border-radius: 4px;
    }

    .evidence.locked {
        opacity: 0.45;
    }

    .evidence-title {
        font-weight: bold;
        margin-bottom: 7px;
    }

    .evidence-text {
        color: #9ca8b5;
        line-height: 1.5;
    }

    .code-box {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    input {
        flex: 1;
        background: #080b10;
        border: 1px solid #344252;
        color: white;
        padding: 12px;
        border-radius: 6px;
        outline: none;
    }

    input:focus {
        border-color: #71849a;
    }

    .message {
        margin-top: 15px;
        padding: 12px;
        border-radius: 6px;
        display: none;
    }

    .success {
        display: block;
        background: #102016;
        border: 1px solid #285a35;
        color: #9be7a8;
    }

    .error {
        display: block;
        background: #211
