        <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Тайна старой киностудии</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: #f5f5f5;
            font-family: Georgia, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .screen {
            width: 90%;
            max-width: 750px;
            padding: 50px 25px;
            border: 1px solid #555;
            background: #1b1b1b;
            box-shadow: 0 0 40px #000;
        }

        .film {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 42px;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        h2 {
            color: #c9a227;
            font-weight: normal;
            margin-bottom: 35px;
        }

        .info {
            color: #aaa;
            line-height: 1.7;
            font-size: 18px;
            margin-bottom: 35px;
        }

        button {
            background: #c9a227;
            color: #111;
            border: none;
            padding: 16px 35px;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e2c04b;
        }

        #characters {
            display: none;
        }

        .character {
            display: block;
            width: 100%;
            margin: 12px 0;
            background: #292929;
            color: white;
            border: 1px solid #555;
        }

        .character:hover {
            background: #3a3a3a;
        }

        #story {
            display: none;
            margin-top: 30px;
            line-height: 1.7;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="screen">

    <div class="film">🎬</div>

    <h1>ТАЙНА СТАРОЙ КИНОСТУДИИ</h1>

    <h2>Дело №001 — «Последняя плёнка»</h2>

    <div id="start">

        <div class="info">
            1963 год.

            Старая киностудия.

            Уникальная киноплёнка исчезла из закрытого архива.
            Спустя десятилетия дело снова открыто.
            

            Четыре человека оказываются втянуты
            в расследование.
        </div>

        <button onclick="showCharacters()">
            НАЧАТЬ РАССЛЕДОВАНИЕ
        </button>

    </div>

    <div id="characters">

        <h2>Выберите роль</h2>

        <button class="character" onclick="chooseCharacter('Режиссёр')">
            🎬 Режиссёр
        </button>

        <button class="character" onclick="chooseCharacter('Киномеханик')">
            🎞️ Киномеханик
        </button>

        <button class="character" onclick="chooseCharacter('Архивариус')">
            🗄️ Архивариус
        </button>

        <button class="character" onclick="chooseCharacter('Журналист')">
            📰 Журналист
        </button>

    </div>

    <div id="story"></div>

</div>

<script>

function showCharacters() {

    document.getElementById("start").style.display = "none";

    document.getElementById("characters").style.display = "block";

}

function chooseCharacter(character) {

    document.getElementById("characters").style.display = "none";

    const story = document.getElementById("story");

    story.style.display = "block";

    story.innerHTML = `
        <h2>Вы — ${character}</h2>

        <p>
        Ваша история начинается.
        </p>

        <p>
        Перед вами лежит старое дело киностудии.
        На первой странице написано:
        </p>

        <p>
        <b>«ПЛЁНКА №17 ИСЧЕЗЛА.</b>

        <b>НЕ ДОВЕРЯЙТЕ НИКОМУ.»</b>
        </p>

        <p>
        Остальные игроки получают свои роли.
        Расследование начинается...
        </p>
        `;

}

</script>

</body>
</html>

    </script>

</body>
</html>
